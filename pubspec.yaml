name: hello_morning
description: Hello-Morning
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  firebase_core: ^2.27.0
  firebase_messaging: ^14.7.19
  firebase_analytics: ^10.8.9
  shared_preferences: ^2.2.3
  contacts_service: ^0.6.3
  permission_handler: ^11.3.1
  intl: ^0.19.0
  background_sms: ^0.0.4
  geolocator: ^11.0.0
  flutter_foreground_task: ^6.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  # 저장소에 assets/smile.png 파일이 있을 때만 아래 두 줄의 주석을 푸세요.
  # assets:
  #   - assets/smile.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "icon.png"
