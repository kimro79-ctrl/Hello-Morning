name: Success Build Final

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      # 키스토어(android/app/upload-keystore.jks)는 저장소에 있는 파일을 그대로 씁니다.
      - name: Decode google-services.json
        run: |
          mkdir -p android/app
          echo "$GOOGLE_SERVICES_BASE64" | base64 --decode --ignore-garbage > android/app/google-services.json
        env:
          GOOGLE_SERVICES_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}

      - name: Check keystore
        run: |
          ls -l android/app/upload-keystore.jks
          keytool -list -keystore android/app/upload-keystore.jks -storepass "$STORE_PASSWORD"
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons (Optional)
        run: flutter pub run flutter_launcher_icons || echo "Icon generation skipped"

      - name: Build Release AAB
        run: flutter build appbundle --release --build-number=${{ github.run_number }}
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: hello-morning-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
